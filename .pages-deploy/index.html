<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthFit</title>
  <style>
    :root { color-scheme: light dark; --bg:#0b1220; --card:#121a2b; --text:#f5f7fb; --muted:#9aa6bf; --accent:#3dd68c; --line:rgba(255,255,255,.08); }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(1200px 600px at 10% -10%,#163024 0%,transparent 50%), var(--bg); color:var(--text); }
    main { max-width:720px; margin:0 auto; padding:40px 24px 64px; }
    h1 { font-size:2rem; margin:0 0 8px; }
    p { color:var(--muted); line-height:1.6; }
    .badge { display:inline-block; background:rgba(61,214,140,.15); color:var(--accent); padding:6px 12px; border-radius:999px; font-size:.8rem; font-weight:700; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:20px; }
    a { color:var(--accent); }
    .links a { display:block; margin:8px 0; }
  </style>
</head>
<body>
  <main>
    <div class="badge">App iOS + Apple Watch · 16+</div>
    <h1>HealthFit</h1>
    <p>Personal trainer inteligente: treinos, nutrição, IAssistente, Dupla/equipe e Apple Health.</p>
    <div class="card">
      <strong>Documentos legais (App Store)</strong>
      <div class="links">
        <a href="./privacidade/">Política de Privacidade</a>
        <a href="./termos/">Termos de Uso</a>
        <a href="./suporte/">Suporte</a>
        <a href="./healthfit/">Página do produto</a>
      </div>
    </div>
  </main>
</body>
</html>
