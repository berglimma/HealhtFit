sonar.projectKey=healthfit
sonar.projectName=HealthFit
sonar.projectVersion=1.0.14
sonar.sourceEncoding=UTF-8

# Community Edition analisa bem JS/TS/HTML/Python.
# Swift completo exige SonarQube Developer+ ou SonarCloud — fontes incluídas para inventário.
sonar.sources=\
  functions/src,\
  firestore.rules,\
  storage.rules,\
  HealthFit/HealthFit/HealthFit,\
  Docs

sonar.tests=\
  HealthFit/HealthFit/HealthFitTests,\
  HealthFit/HealthFit/HealthFitUITests

sonar.exclusions=\
  **/build/**,\
  **/.docx_deps/**,\
  **/DerivedData/**,\
  **/HealthFit/AppStore/**,\
  **/videos/**,\
  **/.pages-deploy/**,\
  **/GoogleService-Info.plist,\
  **/package-lock.json,\
  **/ci_scripts/**,\
  **/scripts/**,\
  **/node_modules/**,\
  **/lib/**,\
  **/*.pbxproj,\
  **/*.xcassets/**,\
  **/*.mp4,\
  **/*.png,\
  **/*.jpg,\
  **/*.json

sonar.coverage.exclusions=\
  **/Views/**,\
  **/Theme/**,\
  **/*View.swift,\
  **/Docs/**

sonar.javascript.file.suffixes=.js,.mjs,.cjs
sonar.typescript.tsconfigPath=functions/tsconfig.json

# Host local (scanner)
sonar.host.url=http://localhost:9000
